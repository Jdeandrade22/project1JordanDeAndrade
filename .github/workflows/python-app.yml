name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb  # Install X virtual framebuffer for GUI tests

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest PySimpleGUI sqlite3
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests (Headless Mode)
        run: |
          # Set environment variable to force headless mode
          export PYTHONUNBUFFERED=1
          python -m unittest discover

      - name: Run GUI tests (with Xvfb)
        run: |
          # Use xvfb-run to simulate a display for GUI tests
          xvfb-run python -m unittest discover
